name: Deploy Blazor WebAssembly to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish Blazor WASM
        run: |
          dotnet publish MetalStorming20.Web/MetalStorming20.Web.csproj \
            -c Release \
            -o build_output \
            /p:BaseHref=/${{ github.event.repository.name }}/ \
            /p:StaticWebAssetBasePath=/${{ github.event.repository.name }}/
      - name: Disable Jekyll processing
        run: touch build_output/wwwroot/.nojekyll
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build_output/wwwroot

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  e2e:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore Playwright test project
        run: dotnet restore MetalStorming20.PlaywrightTests/MetalStorming20.PlaywrightTests.csproj
      - name: Build Playwright tests
        run: dotnet build MetalStorming20.PlaywrightTests/MetalStorming20.PlaywrightTests.csproj -c Release
      - name: Install Playwright browsers
        run: pwsh MetalStorming20.PlaywrightTests/bin/Release/net8.0/playwright.ps1 install --with-deps
      - name: Wait for deployed site
        env:
          DEPLOYED_URL: ${{ needs.deploy.outputs.page_url || format('https://{0}.github.io/{1}/', github.repository_owner, github.event.repository.name) }}
        run: |
          for i in {1..30}; do
            if curl -fsSL "$DEPLOYED_URL" > /dev/null; then
              echo "Site is up at $DEPLOYED_URL"
              exit 0
            fi
            echo "Waiting for $DEPLOYED_URL..."
            sleep 10
          done
          echo "Timed out waiting for $DEPLOYED_URL"
          exit 1
      - name: Run GitHub Pages smoke test
        env:
          PLAYWRIGHT_BASE_URL: ${{ needs.deploy.outputs.page_url || format('https://{0}.github.io/{1}/', github.repository_owner, github.event.repository.name) }}
        run: dotnet test MetalStorming20.PlaywrightTests/MetalStorming20.PlaywrightTests.csproj -c Release --logger "trx;LogFileName=TestResults.trx"


